[package]
name = "wstudio"
version = "0.1.0"
description = "WStudio desktop application"
authors = ["WStudio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
arboard = "3"
open = "5"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
urlencoding = "2"
encoding_rs = "0.8"
regress = { version = "0.12", features = ["utf16"] }
jsonschema = { version = "0.33", default-features = false }
semver = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
futures-util = "0.3"
http = "1"
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
base64 = "0.22"
zeroize = "1"
sha2 = "0.10"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Keyring has no default backend; Windows AI keys must use the persistent OS credential store.
keyring = { version = "3", features = ["windows-native"] }
# Reuse Tauri's WebView2 binding version for native browser history notifications.
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# Persist AI credentials in the user's Keychain instead of keyring's mock backend.
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service provides persistent storage; encrypted sessions use Rust crypto and vendored D-Bus.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
